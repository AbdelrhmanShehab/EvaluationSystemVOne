{% extends "layout.html" %}
{% block title %}تقويم التدريب{% endblock %}

{% block content %}
<div class="container-fluid py-4">

    <h3 class="fw-bold mb-4 text-primary">📅 تقويم التدريب والفعاليات</h3>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">➕ جدولة جلسة تدريبية جديدة</h5>
                    <form action="{{ url_for('training_add_event') }}" method="POST">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">الدورة التدريبية</label>
                                <select name="course_id" class="form-select" required>
                                    <option value="">-- اختر الدورة --</option>
                                    {% for c in courses %}
                                        <option value="{{ c.TrainingCourseID }}">{{ c.TrainingCourseText }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">تاريخ البداية</label>
                                <input type="date" name="start_date" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">تاريخ النهاية (اختياري)</label>
                                <input type="date" name="end_date" class="form-control">
                            </div>
                            <div class="col-12">
                                <label class="form-label">الموقع</label>
                                <input type="text" name="location" class="form-control" placeholder="مثال: قاعة التدريب الرئيسية" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">نوع المدرب</label>
                                <select name="trainer_type" class="form-select" required onchange="toggleTrainerFields()">
                                    <option value="internal">داخلي</option>
                                    <option value="external">خارجي</option>
                                </select>
                            </div>
                            <div class="col-12" id="internalTrainerDiv">
                                <label class="form-label">المدرب الداخلي</label>
                                <select name="instructor_id" class="form-select">
                                    <option value="">-- اختر المدرب --</option>
                                    {% for i in instructors %}
                                        <option value="{{ i.UserID }}">{{ i.Name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6" id="externalNameDiv" style="display:none;">
                                <label class="form-label">اسم المدرب الخارجي</label>
                                <input type="text" name="ext_name" class="form-control">
                            </div>
                            <div class="col-md-6" id="externalCompanyDiv" style="display:none;">
                                <label class="form-label">الشركة</label>
                                <input type="text" name="ext_company" class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success mt-4">💾 حفظ الجلسة</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">🗓️ التقويم</h5>
                    <div id="calendar"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FullCalendar Offline (يجب تحميل الملفات محليًا لو عايز offline كامل) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ar.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ar',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: '/api/training/events',
        eventClick: function(info) {
            info.jsEvent.preventDefault();
            if (info.event.url) {
                window.location.href = info.event.url;
            }
        }
    });
    calendar.render();
});

function toggleTrainerFields() {
    var type = document.querySelector('[name="trainer_type"]').value;
    document.getElementById('internalTrainerDiv').style.display = type === 'internal' ? 'block' : 'none';
    document.getElementById('externalNameDiv').style.display = type === 'external' ? 'block' : 'none';
    document.getElementById('externalCompanyDiv').style.display = type === 'external' ? 'block' : 'none';
}
</script>

<style>
#calendar {
    max-width: 100%;
    margin: 0 auto;
}
.fc-button {
    background-color: #004d7a !important;
    border: none !important;
}
.fc-button:active, .fc-button.fc-button-active {
    background-color: #003d6a !important;
}
</style>

{% endblock %}
